<!-- ===== HEADER / NAV ===== -->
<header class="site-header" id="page">
  <div class="header-inner">
    <a href="index.html" class="logo" aria-label="Pure Green home">
      <img src="https://images.squarespace-cdn.com/content/v1/68cf54d7ee5e480f6b61cf14/b5e63162-b374-4316-8d8d-7d305b7e66ce/Untitled+5.png?format=1500w" alt="Pure Green Lawn and Pest Services LLC.">

    <nav class="main-nav" id="main-nav">
      <a href="about.html">About</a>
      <a href="https://www.facebook.com/p/Pure-Green-Lawn-Pest-Services-100087370140511/" target="_blank" rel="noopener" class="social-link" aria-label="Facebook">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
      </a>
    </nav>

  </div>
</header>

<main>

  <!-- ===== PAGE HERO ===== -->
  <section class="page-hero">
    <div class="page-hero-bg">
      <img fetchpriority="high" decoding="async" src="https://images.squarespace-cdn.com/content/v1/68cf54d7ee5e480f6b61cf14/70a02d37-2066-4530-86ec-92d2a9d3091b/puregreenhero.jpg" alt="">
    </div>
    <div class="page-hero-content">
      <h1>Contact Us</h1>
    </div>
  </section>

  <!-- ===== CONTACT DETAILS + FORM ===== -->
  <section class="contact-page">
    <div class="contact-page-inner">

      <div class="contact-info">
        <img loading="lazy" decoding="async" class="contact-badge" src="https://images.squarespace-cdn.com/content/v1/68cf54d7ee5e480f6b61cf14/b5e63162-b374-4316-8d8d-7d305b7e66ce/Untitled+5.png?format=1500w" alt="Logo with three green leaves and the text 'Pure Green' inside a white square outlined in green.">
        <h2>Contact us for a <em>free</em> quote today!</h2>
        <ul class="contact-details">
          <li>
            <a href="mailto:info@puregreenpest.com">info@puregreenpest.com</a>
          </li>
          <li>
            <a href="tel:+19413066817">(941) 306-6817</a>
          </li>
        </ul>
      </div>

      <form id="contact-form" class="contact-form">
  <div class="form-row">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
  </div>
  <input type="tel" name="phone" placeholder="Phone">
  <input type="text" name="address" placeholder="Home Address">
  <textarea name="message" rows="5" placeholder="Tell us what you need help with..." required></textarea>
  <button type="submit" class="btn btn-primary">Send Message</button>
  <p class="form-status" id="form-status" aria-live="polite"></p>
</form>

    </div>
  </section>

</main>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <div class="footer-inner">

      <div class="footer-col">
        <p class="footer-heading">Explore</p>
        <a href="about.html">About us</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="footer-col">

      <p>Sign up with your email address to receive news and updates.</p>
      <form id="newsletter-form" class="newsletter-form">
        <label for="newsletter-email" class="sr-only">Email Address</label>
        <input type="email" id="newsletter-email" placeholder="Email Address" required>
        <button type="submit" class="btn btn-outline">Sign Up</button>
      </form>
      <p class="newsletter-status" id="newsletter-status" aria-live="polite"></p>
    </div>

    <p class="footer-copy">&copy; <span id="year"></span> Pure Green Lawn and Pest Services LLC.</p>
  </div>
</footer>
